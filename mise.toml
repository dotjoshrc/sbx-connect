[tools]
go = "1.27.1"
"go:golang.org/x/tools/cmd/goimports" = "0.51.0"
gofumpt = "0.12.0"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"

[tasks]
[tasks.lint]
run = "golangci-lint run --timeout 5m"

[tasks.format]
run = [
  "goimports -local github.com/dotjoshrc/sbx-connect -w .",
  "gofumpt -w .",
]
